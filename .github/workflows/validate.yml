name: Validate changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/seat-availability-monitor]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
