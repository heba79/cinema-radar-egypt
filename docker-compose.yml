# Self-hosting option for the worker on any VPS:  docker compose up -d --build
services:
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    restart: always
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
